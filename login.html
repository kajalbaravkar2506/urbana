<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Log in to your Urbana Fashion account to track orders and manage your wishlist.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urbana Fashion</title>
    <link rel="stylesheet" href="urbana.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="header"></div>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Login to your Urbana account</div>
        <div id="signup-success" style="display:none;background:#eafaf1;border:1px solid #b7e4c7;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600;color:#1a7a40;margin-bottom:16px;">
            ✓ Account created! Please login below.
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <a href="forgotpassword.html" class="forgot-link">Forgot password?</a>
        </div>
        <button class="btn-primary" onclick="handleEmailLogin()">LOGIN</button>

        <div class="or-divider">OR</div>

        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text" id="mobile" placeholder="10-digit mobile number"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10">
        </div>
        <div class="input-group" id="otp-group">
            <label>Enter OTP</label>
            <input type="text" id="otp-field" placeholder="4-digit OTP"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="4">
        </div>
        <button class="btn-otp" id="otp-btn" onclick="handleOTP()">LOGIN WITH OTP</button>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
        
    </div>
</div>
<div id="footer"></div>
<script src="common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    loadLayout();
    localStorage.removeItem("urbana-user");
    if (new URLSearchParams(window.location.search).get("created") === "1") {
        document.getElementById("signup-success").style.display = "block";
    }
    document.querySelectorAll(".auth-card input").forEach(inp => {
        inp.addEventListener("input", () => clearError(inp.id));
    });
});

function setError(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "#e74c3c";
    el.style.background  = "#fff8f8";
    let err = document.getElementById("err-" + id);
    if (!err) {
        err = document.createElement("div");
        err.id = "err-" + id;
        err.style.cssText = "color:#e74c3c;font-size:11px;font-weight:600;margin-top:5px;";
        el.parentNode.insertBefore(err, el.nextSibling);
    }
    err.textContent = msg;
}

function clearError(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "";
    el.style.background  = "";
    const err = document.getElementById("err-" + id);
    if (err) err.textContent = "";
}

function clearAll() {
    ["email","password","mobile","otp-field"].forEach(clearError);
}

let generatedOTP = "";

function handleOTP() {
    const mobile   = document.getElementById("mobile").value.trim();
    const otpGroup = document.getElementById("otp-group");
    const btn      = document.getElementById("otp-btn");

    if (otpGroup.style.display === "none" || otpGroup.style.display === "") {
        if (mobile.length !== 10) { setError("mobile", "Enter a valid 10-digit mobile number"); return; }
        clearError("mobile");
        generatedOTP = Math.floor(1000 + Math.random() * 9000);
        // Show OTP inline instead of alert
        const otpNotice = document.getElementById("otp-notice") || (() => {
            const el = document.createElement("div");
            el.id = "otp-notice";
            el.style.cssText = "background:#eafaf1;border:1px solid #b7e4c7;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:600;color:#1a7a40;margin-bottom:12px;";
            document.getElementById("otp-group").parentNode.insertBefore(el, document.getElementById("otp-group"));
            return el;
        })();
        otpNotice.textContent = "OTP sent! (Demo OTP: " + generatedOTP + ")";
        otpGroup.style.display = "block";
        btn.textContent = "VERIFY OTP";
    } else {
        if (document.getElementById("otp-field").value != generatedOTP) {
            setError("otp-field", "Incorrect OTP. Please try again.");
            return;
        }
        clearError("otp-field");
        const accounts = JSON.parse(localStorage.getItem("urbana-accounts")) || [];
        const account  = accounts.find(a => a.mobile === mobile);
        const name     = account ? (account.fname + " " + account.lname).trim() : "User";
        localStorage.setItem("urbana-user", JSON.stringify({
            mobile, name,
            email:       account ? account.email       : "",
            joinedMonth: account ? account.joinedMonth : ""
        }));
        window.location.href = "index.html";
    }
}

function handleEmailLogin() {
    clearAll();
    const email    = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    let valid = true;

    if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/i.test(email)) { setError("email", "Enter a valid email address"); valid = false; }
    if (!password) { setError("password", "Please enter your password"); valid = false; }
    if (!valid) return;

    const accounts = JSON.parse(localStorage.getItem("urbana-accounts")) || [];
    const account  = accounts.find(a => a.email === email);

    if (!account) { setError("email", "No account found with this email"); return; }
    if (account.password !== password) { setError("password", "Incorrect password"); return; }

    const name = (account.fname + " " + account.lname).trim();
    localStorage.setItem("urbana-user", JSON.stringify({
        email: account.email, mobile: account.mobile,
        name,  joinedMonth: account.joinedMonth || ""
    }));
    window.location.href = "index.html";
}
</script>
</body>
</html>
