<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Log in to your Urbana Fashion account to track orders and manage your wishlist.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Urbana Fashion</title>
    <link rel="stylesheet" href="urbana.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="header"></div>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Login to your Urbana account</div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <a href="forgotpassword.html" class="forgot-link">Forgot password?</a>
        </div>
        <button class="btn-primary" onclick="handleEmailLogin()">LOGIN</button>

        <div class="or-divider">OR</div>

        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text" id="mobile" placeholder="10-digit mobile number"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10">
        </div>
        <div class="input-group" id="otp-group">
            <label>Enter OTP</label>
            <input type="text" id="otp-field" placeholder="4-digit OTP"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="4">
        </div>
        <button class="btn-otp" id="otp-btn" onclick="handleOTP()">LOGIN WITH OTP</button>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
        
    </div>
</div>
<div id="footer"></div>
<script src="common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => { loadLayout(); });
let generatedOTP = "";
function handleOTP() {
    const mobile = document.getElementById("mobile").value.trim();
    const otpGroup = document.getElementById("otp-group");
    const btn = document.getElementById("otp-btn");
    if (otpGroup.style.display === "none" || otpGroup.style.display === "") {
        if (mobile.length !== 10) { alert("Please enter a valid 10-digit mobile number"); return; }
        generatedOTP = Math.floor(1000 + Math.random() * 9000);
        alert("Your OTP is: " + generatedOTP);
        otpGroup.style.display = "block";
        btn.textContent = "VERIFY OTP";
    } else {
        if (document.getElementById("otp-field").value == generatedOTP) {
            localStorage.setItem("urbana-user", JSON.stringify({ mobile: mobile, name: "User" }));
            window.location.href = "index.html";
        } else { alert("Incorrect OTP. Please try again."); }
    }
}
function handleEmailLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/i.test(email)) { alert("Please enter a valid email address"); return; }
    if (!password) { alert("Please enter your password"); return; }
    const name = email.split("@")[0].charAt(0).toUpperCase() + email.split("@")[0].slice(1);
    localStorage.setItem("urbana-user", JSON.stringify({ email: email, name: name }));
    window.location.href = "index.html";
}
</script>
</body>
</html>
