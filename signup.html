<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Create your Urbana Fashion account and start shopping.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Urbana Fashion</title>
    <link rel="stylesheet" href="urbana.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="header"></div>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-title">Create account</div>
        <div class="auth-sub">Join Urbana and start shopping</div>

        <div class="name-row">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="fname" placeholder="First name">
            </div>
            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Last name">
            </div>
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="input-group">
            <label>Mobile Number</label>
            <input type="text" id="mobile" placeholder="10-digit mobile number"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters">
        </div>

        <button class="btn-primary" onclick="createAccount()">CREATE ACCOUNT</button>
        <div class="terms-note">By creating an account you agree to our <a href="termsofservice.html">Terms of Service</a> &amp; <a href="privacypolicy.html">Privacy Policy</a></div>

        <div class="auth-footer">Already have an account? <a href="login.html">Login</a></div>
    </div>
</div>
<div id="footer"></div>
<script src="common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    loadLayout();
    document.querySelectorAll(".auth-card input").forEach(inp => {
        inp.addEventListener("input", () => clearError(inp.id));
    });
});

function setError(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "#e74c3c";
    el.style.background  = "#fff8f8";
    let err = document.getElementById("err-" + id);
    if (!err) {
        err = document.createElement("div");
        err.id = "err-" + id;
        err.style.cssText = "color:#e74c3c;font-size:11px;font-weight:600;margin-top:5px;";
        el.parentNode.insertBefore(err, el.nextSibling);
    }
    err.textContent = msg;
}

function clearError(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "";
    el.style.background  = "";
    const err = document.getElementById("err-" + id);
    if (err) err.textContent = "";
}

function createAccount() {
    ["fname","lname","email","mobile","password"].forEach(clearError);

    const fname    = document.getElementById("fname").value.trim();
    const lname    = document.getElementById("lname").value.trim();
    const email    = document.getElementById("email").value.trim().toLowerCase();
    const mobile   = document.getElementById("mobile").value.trim();
    const password = document.getElementById("password").value;
    let valid = true;

    if (!fname) { setError("fname", "Enter your first name"); valid = false; }
    if (!lname) { setError("lname", "Enter your last name"); valid = false; }
    if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/i.test(email)) { setError("email", "Enter a valid email address"); valid = false; }
    if (mobile.length !== 10) { setError("mobile", "Enter a valid 10-digit mobile number"); valid = false; }
    if (password.length < 6)  { setError("password", "Password must be at least 6 characters"); valid = false; }
    if (!valid) return;

    const accounts = JSON.parse(localStorage.getItem("urbana-accounts")) || [];
    if (accounts.find(a => a.email === email)) {
        setError("email", "An account with this email already exists");
        return;
    }

    const now = new Date();
    const joinedMonth = now.toLocaleString("default", { month: "short" }) + " " + now.getFullYear();
    accounts.push({ fname, lname, email, mobile, password, joinedMonth });
    localStorage.setItem("urbana-accounts", JSON.stringify(accounts));

    window.location.href = "login.html?created=1";
}
</script>
</body>
</html>
