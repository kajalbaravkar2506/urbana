<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Secure checkout at Urbana Fashion. Fast delivery across India.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Urbana Fashion</title>
    <link rel="stylesheet" href="urbana.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"></noscript>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>

<div id="header"></div>
<div></div>
<div class="checkout-page">
    <!-- BREADCRUMB -->
    <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep">›</span>
        <a href="cart.html">Cart</a>
        <span class="sep">›</span>
        <span class="active">Checkout</span>
    </div>

    <div class="page-title">Checkout</div>

    <div class="checkout-grid">

        <!-- LEFT -->
        <div>

            <!-- SHIPPING DETAILS -->
            <div class="card">
                <div class="card-title">
                    <i data-lucide="truck" style="width:15px;height:15px;"></i>
                    Shipping Details
                </div>

                <div class="form-row">
                    <div class="field"><input type="text" id="fname" placeholder="First Name *"></div>
                    <div class="field"><input type="text" id="lname" placeholder="Last Name *"></div>
                </div>
                <div class="form-row">
                    <div class="field"><input type="email" id="email" placeholder="Email *"></div>
                    <div class="field"><input type="text" id="mobile" placeholder="Phone *" oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="10"></div>
                </div>
                <div class="form-row single">
                    <div class="field"><input type="text" id="addr1" placeholder="Street Address *"></div>
                </div>
                <div class="form-row triple">
                    <div class="field"><input type="text" id="city" placeholder="City *"></div>
                    <div class="field">
                        <select id="state">
                            <option value="">State *</option>
                            <option>Andhra Pradesh</option><option>Assam</option>
                            <option>Bihar</option><option>Delhi</option>
                            <option>Goa</option><option>Gujarat</option>
                            <option>Haryana</option><option>Karnataka</option>
                            <option>Kerala</option><option>Madhya Pradesh</option>
                            <option>Maharashtra</option><option>Punjab</option>
                            <option>Rajasthan</option><option>Tamil Nadu</option>
                            <option>Telangana</option><option>Uttar Pradesh</option>
                            <option>West Bengal</option>
                        </select>
                    </div>
                    <div class="field"><input type="text" id="pin" placeholder="PIN Code *" oninput="this.value=this.value.replace(/[^0-9]/g,'')" maxlength="6"></div>
                </div>
            </div>

            <!-- PAYMENT METHOD -->
            <div class="card">
                <div class="card-title">
                    <i data-lucide="credit-card" style="width:15px;height:15px;"></i>
                    Payment Method
                </div>

                <div class="payment-list">

                    <label class="pay-option selected" onclick="selectPay(this,'cod')">
                        <input type="radio" name="pay" value="cod" checked>
                        Cash on Delivery
                    </label>

                    <label class="pay-option" onclick="selectPay(this,'upi')">
                        <input type="radio" name="pay" value="upi">
                        <div style="flex:1;">
                            UPI
                            <div class="pay-sub" id="sub-upi">
                                <input type="text" placeholder="Enter UPI ID (e.g. name@upi)" onclick="event.stopPropagation()">
                            </div>
                        </div>
                    </label>

                    <label class="pay-option" onclick="selectPay(this,'card')">
                        <input type="radio" name="pay" value="card">
                        <div style="flex:1;">
                            Credit / Debit Card
                            <div class="pay-sub" id="sub-card">
                                <input type="text" placeholder="Card number" oninput="this.value=this.value.replace(/[^0-9]/g,'').replace(/(.{4})/g,'$1 ').trim()" maxlength="19" onclick="event.stopPropagation()">
                                <div class="card-sub-grid">
                                    <input type="text" placeholder="MM / YY" maxlength="7" oninput="formatExpiry(this)" onclick="event.stopPropagation()">
                                    <input type="password" placeholder="CVV" maxlength="3" onclick="event.stopPropagation()">
                                </div>
                                <input type="text" placeholder="Name on card" onclick="event.stopPropagation()">
                            </div>
                        </div>
                    </label>

                    <label class="pay-option" onclick="selectPay(this,'netbanking')">
                        <input type="radio" name="pay" value="netbanking">
                        Net Banking
                    </label>

                </div>
            </div>

        </div>

        <!-- RIGHT — ORDER SUMMARY -->
        <div class="summary-card">
            <div class="summary-title">Order Summary</div>

            <div id="summary-items"><!-- JS --></div>

            <!-- Coupon -->
            <div class="coupon-wrap">
                <input type="text" id="coupon-input" placeholder="Coupon code">
                <button onclick="applyCoupon()">APPLY</button>
            </div>
            <div class="coupon-msg" id="coupon-msg"></div>

            <hr class="summary-divider">

            <div class="summary-row"><span>Subtotal</span><span id="s-sub">₹0</span></div>
            <div class="summary-row" id="s-savings-row" style="display:none;color:#4caf50;font-weight:700;"><span>Discount</span><span id="s-savings">-₹0</span></div>
            <div class="summary-row"><span>Shipping</span><span id="s-shipping" style="font-weight:700;">₹49</span></div>
            <div class="summary-row total"><span>Total</span><span id="s-total">₹0</span></div>

            <button class="place-btn" onclick="placeOrder()">PLACE ORDER</button>

            <div class="secure-note">
                <i data-lucide="lock" style="width:12px;height:12px;"></i>
                Secure &amp; encrypted checkout
            </div>
        </div>

    </div>
</div>

<div id="footer"></div>
<script src="common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    loadLayout();
    setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 300);
    loadSummary();
    ["fname","lname","email","mobile","addr1","city","pin"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener("input", () => clearFieldError(id));
    });
    const stateEl = document.getElementById("state");
    if (stateEl) stateEl.addEventListener("change", () => clearFieldError("state"));
});

const COUPONS = { "URBANA10": 10, "SAVE20": 20, "FIRST15": 15 };
let appliedDiscount = 0;
let subtotal = 0;

function getDiscountedPrice(product){
    const disc = product?.discount || 0;
    return disc ? Math.round((product.price || 0) - ((product.price || 0) * disc / 100)) : (product?.price || 0);
}

function loadSummary() {
    const cart = JSON.parse(localStorage.getItem("urbana-cart")) || [];
    const container = document.getElementById("summary-items");

    if (!cart.length) {
        container.innerHTML = `<div class="summary-item">
            <div class="s-item-img">👕</div>
            <div class="s-item-info">
                <div class="s-item-name">Urbana Classic T-Shirt</div>
                <div class="s-item-meta">Size: M · Qty: 1</div>
            </div>
            <div class="s-item-price">₹499</div>
        </div>`;
        subtotal = 499;
    } else {
        subtotal = 0;
        container.innerHTML = cart.map(item => {
            const unitPrice = getDiscountedPrice(item.product);
            const price = unitPrice * (item.quantity || 1);
            subtotal += price;
            const img = item.product?.image
                ? `<img src="${item.product.image}" alt="${item.product.name}">`
                : '👕';
            return `<div class="summary-item">
                <div class="s-item-img">${img}</div>
                <div class="s-item-info">
                    <div class="s-item-name">${item.product?.name || 'Product'}</div>
                    <div class="s-item-meta">Size: ${item.size || 'M'} · Qty: ${item.quantity || 1}</div>
                </div>
                <div class="s-item-price">₹${price.toLocaleString('en-IN')}</div>
            </div>`;
        }).join('');
    }
    updateTotals();
}

function updateTotals() {
    const cart = JSON.parse(localStorage.getItem("urbana-cart")) || [];
    // Product-level savings (MRP - discounted price)
    const productSavings = cart.reduce((sum, item) => {
        const disc = item.product?.discount || 0;
        if (disc) {
            const mrp = item.product.price || 0;
            const discounted = Math.round(mrp - mrp * disc / 100);
            return sum + (mrp - discounted) * (item.quantity || 1);
        }
        return sum;
    }, 0);

    const couponOff = appliedDiscount ? Math.round(subtotal * appliedDiscount / 100) : 0;
    const shipping = (subtotal - couponOff) >= 999 ? 0 : 49;
    const total    = subtotal - couponOff + shipping;
    document.getElementById("s-sub").textContent   = "₹" + subtotal.toLocaleString("en-IN");
    document.getElementById("s-total").textContent = "₹" + total.toLocaleString("en-IN");
    const row = document.getElementById("s-savings-row");
    const totalSavings = productSavings + couponOff;
    if (totalSavings > 0) {
        row.style.display = "flex";
        document.getElementById("s-savings").textContent = "-₹" + totalSavings.toLocaleString("en-IN");
    } else {
        row.style.display = "none";
    }
    const shipEl = document.getElementById("s-shipping");
    if (shipEl) {
        shipEl.textContent = shipping === 0 ? "FREE 🎉" : "₹" + shipping;
        shipEl.style.color = shipping === 0 ? "#4caf50" : "#1a1a1a";
    }
}

function applyCoupon() {
    const code = document.getElementById("coupon-input").value.trim().toUpperCase();
    const msg  = document.getElementById("coupon-msg");
    if (!code) { msg.className = "coupon-msg err"; msg.textContent = "Enter a coupon code"; return; }
    if (COUPONS[code]) {
        appliedDiscount = COUPONS[code];
        msg.className = "coupon-msg ok";
        msg.textContent = `✓ ${appliedDiscount}% off applied!`;
        updateTotals();
    } else {
        appliedDiscount = 0;
        msg.className = "coupon-msg err";
        msg.textContent = "Invalid coupon code";
        updateTotals();
    }
}

function selectPay(el, type) {
    document.querySelectorAll('.pay-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    document.querySelectorAll('.pay-sub').forEach(s => s.classList.remove('visible'));
    const sub = document.getElementById('sub-' + type);
    if (sub) sub.classList.add('visible');
}

function formatExpiry(input) {
    let v = input.value.replace(/\D/g,'').slice(0,4);
    if (v.length >= 3) v = v.slice(0,2) + ' / ' + v.slice(2);
    input.value = v;
}

function setFieldError(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "#e74c3c";
    el.style.background  = "#fff8f8";
    let err = document.getElementById("err-" + id);
    if (!err) {
        err = document.createElement("div");
        err.id = "err-" + id;
        err.style.cssText = "color:#e74c3c;font-size:11px;font-weight:600;margin-top:4px;";
        el.parentNode.appendChild(err);
    }
    err.textContent = msg;
}

function clearFieldError(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "";
    el.style.background  = "";
    const err = document.getElementById("err-" + id);
    if (err) err.textContent = "";
}

function clearAllFieldErrors() {
    ["fname","lname","email","mobile","addr1","city","state","pin"].forEach(clearFieldError);
}

function placeOrder() {
    clearAllFieldErrors();

    const fname  = document.getElementById("fname").value.trim();
    const lname  = document.getElementById("lname").value.trim();
    const email  = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const addr1  = document.getElementById("addr1").value.trim();
    const city   = document.getElementById("city").value.trim();
    const state  = document.getElementById("state").value;
    const pin    = document.getElementById("pin").value.trim();
    let valid = true;

    if (!fname)  { setFieldError("fname",  "Enter your first name"); valid = false; }
    if (!lname)  { setFieldError("lname",  "Enter your last name");  valid = false; }
    if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/i.test(email)) { setFieldError("email", "Enter a valid email address"); valid = false; }
    if (mobile.length !== 10) { setFieldError("mobile", "Enter a valid 10-digit phone number"); valid = false; }
    if (!addr1)  { setFieldError("addr1",  "Enter your street address"); valid = false; }
    if (!city)   { setFieldError("city",   "Enter your city");           valid = false; }
    if (!state)  { setFieldError("state",  "Select your state");         valid = false; }
    if (pin.length !== 6) { setFieldError("pin", "Enter a valid 6-digit PIN code"); valid = false; }
    if (!valid) return;

    const payment = document.querySelector('input[name="pay"]:checked').value;
    if (payment === 'upi') {
        const upiInput = document.querySelector('#sub-upi input');
        if (!upiInput.value.trim().includes('@')) {
            upiInput.style.borderColor = "#e74c3c";
            upiInput.style.background  = "#fff8f8";
            let err = document.getElementById("err-upi");
            if (!err) {
                err = document.createElement("div");
                err.id = "err-upi";
                err.style.cssText = "color:#e74c3c;font-size:11px;font-weight:600;margin-top:4px;";
                upiInput.parentNode.appendChild(err);
            }
            err.textContent = "Enter a valid UPI ID (e.g. name@upi)";
            return;
        }
    }
    if (payment === 'card') {
        const cardInput = document.querySelector('#sub-card input');
        const num = cardInput.value.replace(/\s/g,'');
        if (num.length < 16) {
            cardInput.style.borderColor = "#e74c3c";
            cardInput.style.background  = "#fff8f8";
            let err = document.getElementById("err-card");
            if (!err) {
                err = document.createElement("div");
                err.id = "err-card";
                err.style.cssText = "color:#e74c3c;font-size:11px;font-weight:600;margin-top:4px;";
                cardInput.parentNode.appendChild(err);
            }
            err.textContent = "Enter a valid 16-digit card number";
            return;
        }
    }

    const couponOff = appliedDiscount ? Math.round(subtotal * appliedDiscount / 100) : 0;
    const shipping = (subtotal - couponOff) >= 999 ? 0 : 49;
    sessionStorage.setItem("urbana-order", JSON.stringify({
        fname, lname, email, mobile, addr1, city, state, pin, payment,
        savings: couponOff, subtotal, shipping
    }));

    window.location.href = "orderconfirmation.html";
}
</script>
</body>
</html>
