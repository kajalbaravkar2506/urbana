<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Manage your Urbana account, orders, and wishlist.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Urbana Fashion</title>
    <link rel="stylesheet" href="urbana.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="header"></div>

<div class="dash-page">
    <div class="dash-top">
        <div>
            <div class="dash-title">MY ACCOUNT</div>
            <div class="dash-welcome" id="dashWelcome">Welcome back</div>
        </div>
        <button class="dash-signout" onclick="logoutUser()">
            <i data-lucide="log-out"></i> Sign Out
        </button>
    </div>

    <div class="dash-body">
        <aside class="dash-sidebar">
            <button class="nav-item active" data-tab="overview"><i data-lucide="user"></i> Overview</button>
            <button class="nav-item" data-tab="orders"><i data-lucide="package"></i> My Orders</button>
            <button class="nav-item" data-tab="wishlist"><i data-lucide="heart"></i> Wishlist</button>
            <button class="nav-item" data-tab="profile"><i data-lucide="pencil"></i> Profile</button>
            <button class="nav-item" data-tab="addresses"><i data-lucide="map-pin"></i> Addresses</button>
        </aside>

        <div class="dash-content">

            <!-- OVERVIEW -->
            <div class="dash-panel active" id="tab-overview">
                <div class="stat-cards">
                    <div class="stat-card" onclick="switchTab('orders')">
                        <div class="stat-num" id="ov-orders">0</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-card" onclick="switchTab('wishlist')">
                        <div class="stat-num" id="ov-wish">0</div>
                        <div class="stat-label">Wishlist Items</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-num" id="ov-since">—</div>
                        <div class="stat-label">Member Since</div>
                    </div>
                </div>
                <div class="dash-block">
                    <div class="block-header">
                        <div class="block-title">Recent Orders</div>
                        <button class="block-link" onclick="switchTab('orders')">View All <i data-lucide="chevron-right"></i></button>
                    </div>
                    <div id="recent-orders-wrap"></div>
                </div>
                <div class="dash-block">
                    <div class="block-header">
                        <div class="block-title">Your Wishlist</div>
                        <button class="block-link" onclick="switchTab('wishlist')">View All <i data-lucide="chevron-right"></i></button>
                    </div>
                    <div id="wishlist-preview"></div>
                </div>
            </div>

            <!-- ORDERS -->
            <div class="dash-panel" id="tab-orders">
                <div class="dash-block">
                    <div class="block-header"><div class="block-title">My Orders</div></div>
                    <div id="orders-list-wrap"></div>
                </div>
            </div>

            <!-- WISHLIST -->
            <div class="dash-panel" id="tab-wishlist">
                <div class="dash-block">
                    <div class="block-header">
                        <div class="block-title">Wishlist</div>
                        <span id="wishlist-count-label" style="font-size:12px;color:#aaa;font-weight:600;"></span>
                    </div>
                    <div id="wishlist-full-wrap"></div>
                </div>
            </div>

            <!-- PROFILE -->
            <div class="dash-panel" id="tab-profile">
                <div class="dash-block">
                    <div class="block-header"><div class="block-title">My Profile</div></div>
                    <div class="form-body">
                        <div class="form-grid">
                            <div class="form-group"><label>First Name</label><input type="text" id="pf-fname" placeholder="First name"></div>
                            <div class="form-group"><label>Last Name</label><input type="text" id="pf-lname" placeholder="Last name"></div>
                            <div class="form-group"><label>Email Address</label><input type="email" id="pf-email" placeholder="you@example.com"></div>
                            <div class="form-group"><label>Mobile Number</label><input type="text" id="pf-mobile" placeholder="10-digit number"></div>
                            <div class="form-group"><label>Date of Birth</label><input type="date" id="pf-dob"></div>
                            <div class="form-group"><label>Gender</label><select id="pf-gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select></div>
                        </div>
                        <button class="form-save" onclick="saveProfile()">SAVE CHANGES</button>
                        <div class="save-ok" id="save-ok">✓ Profile updated</div>
                    </div>
                </div>
            </div>

            <!-- ADDRESSES -->
            <div class="dash-panel" id="tab-addresses">
                <div class="dash-block">
                    <div class="block-header"><div class="block-title">Saved Addresses</div></div>

                    <!-- ADD / EDIT FORM (hidden by default) -->
                    <div id="addr-form-wrap" style="display:none;padding:20px 24px;border-bottom:1px solid #f0f0f0;">
                        <div style="font-size:13px;font-weight:700;color:#111;margin-bottom:16px;" id="addr-form-title">Add New Address</div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                            <div>
                                <input id="af-name"  type="text"   placeholder="Full Name *"           style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;">
                            </div>
                            <div>
                                <input id="af-phone" type="text"   placeholder="Phone *" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'')" style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;">
                            </div>
                            <div style="grid-column:1/-1;">
                                <input id="af-addr"  type="text"   placeholder="Street Address *"       style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;">
                            </div>
                            <div>
                                <input id="af-city"  type="text"   placeholder="City *"                 style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;">
                            </div>
                            <div>
                                <input id="af-pin"   type="text"   placeholder="PIN Code *" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')" style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;">
                            </div>
                            <div>
                                <select id="af-state" style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;background:white;">
                                    <option value="">State *</option>
                                    <option>Andhra Pradesh</option><option>Assam</option><option>Bihar</option>
                                    <option>Delhi</option><option>Goa</option><option>Gujarat</option>
                                    <option>Haryana</option><option>Karnataka</option><option>Kerala</option>
                                    <option>Madhya Pradesh</option><option>Maharashtra</option><option>Punjab</option>
                                    <option>Rajasthan</option><option>Tamil Nadu</option><option>Telangana</option>
                                    <option>Uttar Pradesh</option><option>West Bengal</option>
                                </select>
                            </div>
                            <div>
                                <select id="af-type" style="width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:13px;outline:none;background:white;">
                                    <option value="home">🏠 Home</option>
                                    <option value="work">🏢 Work</option>
                                    <option value="other">📦 Other</option>
                                </select>
                            </div>
                        </div>
                        <div id="addr-form-err" style="color:#e74c3c;font-size:11px;font-weight:600;margin-top:8px;min-height:14px;"></div>
                        <div style="display:flex;gap:10px;margin-top:16px;">
                            <button onclick="saveAddress()" style="padding:11px 28px;background:#111;color:white;border:none;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='#f4a000'" onmouseout="this.style.background='#111'">SAVE ADDRESS</button>
                            <button onclick="closeAddrForm()" style="padding:11px 20px;background:none;color:#888;border:1.5px solid #ddd;border-radius:8px;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;cursor:pointer;">CANCEL</button>
                        </div>
                    </div>

                    <div class="addr-grid" id="addr-grid-wrap"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="footer"></div>
<script src="common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const userRaw = localStorage.getItem("urbana-user");
    if (!userRaw) { window.location.href = "login.html"; return; }
    const user = JSON.parse(userRaw);
    const name = user.name || "User";

    document.getElementById("dashWelcome").textContent = "Welcome back, " + (user.email || user.mobile || name).toLowerCase();

    const now = new Date();
    const joined = user.joinedMonth || (now.toLocaleString("default", { month: "short" }) + " " + now.getFullYear());
    document.getElementById("ov-since").textContent = joined;

    const wishlist = JSON.parse(localStorage.getItem("urbana-wishlist")) || [];
    document.getElementById("ov-wish").textContent = wishlist.length;
    document.getElementById("wishlist-count-label").textContent = wishlist.length + " item" + (wishlist.length !== 1 ? "s" : "");

    const orders = JSON.parse(localStorage.getItem("urbana-orders")) || [];
    document.getElementById("ov-orders").textContent = orders.length;

    const parts = name.split(" ");
    document.getElementById("pf-fname").value = parts[0] || "";
    document.getElementById("pf-lname").value = parts.slice(1).join(" ") || "";
    document.getElementById("pf-email").value = user.email || "";
    document.getElementById("pf-mobile").value = user.mobile || "";

    renderOrders(orders, "recent-orders-wrap", 2);
    renderOrders(orders, "orders-list-wrap", 999);
    renderWishlist(wishlist, "wishlist-preview", 4);
    renderWishlist(wishlist, "wishlist-full-wrap", 999);
    renderAddresses();

    // Re-render if user navigates back to this page (e.g. after placing order)
    window.addEventListener("focus", () => {
        const freshOrders = JSON.parse(localStorage.getItem("urbana-orders")) || [];
        const freshWishlist = JSON.parse(localStorage.getItem("urbana-wishlist")) || [];
        document.getElementById("ov-orders").textContent = freshOrders.length;
        document.getElementById("ov-wish").textContent = freshWishlist.length;
        document.getElementById("wishlist-count-label").textContent = freshWishlist.length + " item" + (freshWishlist.length !== 1 ? "s" : "");
        renderOrders(freshOrders, "recent-orders-wrap", 2);
        renderOrders(freshOrders, "orders-list-wrap", 999);
        renderWishlist(freshWishlist, "wishlist-preview", 4);
        renderWishlist(freshWishlist, "wishlist-full-wrap", 999);
    });

    loadLayout();
    lucide.createIcons();

    document.querySelectorAll(".nav-item[data-tab]").forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });
    const hash = window.location.hash.replace("#", "");
    if (hash) switchTab(hash);
});

function switchTab(tab) {
    document.querySelectorAll(".dash-panel").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav-item[data-tab]").forEach(b => b.classList.remove("active"));
    const panel = document.getElementById("tab-" + tab);
    const btn = document.querySelector(`.nav-item[data-tab="${tab}"]`);
    if (panel) panel.classList.add("active");
    if (btn) btn.classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderOrders(orders, id, limit) {
    const wrap = document.getElementById(id);
    if (!wrap) return;
    if (!orders.length) {
        wrap.innerHTML = `<div class="empty-box"><i data-lucide="package"></i><p>No orders yet</p><a href="index.html">Start Shopping <i data-lucide="arrow-right"></i></a></div>`;
        if (window.lucide) lucide.createIcons(); return;
    }
    wrap.innerHTML = orders.slice(0, limit).map(o => {
        const thumb = o.image
            ? `<img src="${o.image}" alt="${o.name}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">`
            : (o.emoji || "👕");
        return `<div class="order-row">
            <div class="order-thumb">${thumb}</div>
            <div class="order-info">
                <div class="order-name">${o.name}</div>
                <div class="order-meta">${o.meta || ""} ${o.id ? "· #" + o.id : ""}</div>
                <div class="order-price">${o.price}</div>
            </div>
            <div class="order-right">
                <span class="status-badge ${o.statusClass || "s-processing"}">${o.status || "Processing"}</span>
                <span class="order-date">${o.date || ""}</span>
                <div class="order-actions">
                    <button class="btn-xs btn-xs-dark">REORDER</button>
                    <button class="btn-xs btn-xs-out">INVOICE</button>
                </div>
            </div>
        </div>`;
    }).join("");
    if (window.lucide) lucide.createIcons();
}

function renderWishlist(wishlist, id, limit) {
    const wrap = document.getElementById(id);
    if (!wrap) return;
    if (!wishlist.length) {
        wrap.innerHTML = `<div class="empty-box"><i data-lucide="heart"></i><p>Nothing saved yet</p><a href="wishlist.html">Go to Wishlist <i data-lucide="arrow-right"></i></a></div>`;
        if (window.lucide) lucide.createIcons(); return;
    }
    wrap.innerHTML = `<div class="wish-grid">${wishlist.slice(0, limit).map(item => {
        const img = item.image
            ? `<img src="${item.image}" alt="${item.name || "Product"}">`
            : "👗";
        const price = item.price ? "₹" + item.price : (item.priceFormatted || "—");
        return `<div class="wish-card">
            <div class="wish-img">${img}</div>
            <div class="wish-name">${item.name || "Product"}</div>
            <div class="wish-price">${price}</div>
            <button class="wish-btn" onclick="window.location.href='cart.html'">ADD TO BAG</button>
        </div>`;
    }).join("")}</div>`;
    if (window.lucide) lucide.createIcons();
}

function saveProfile() {
    const user = JSON.parse(localStorage.getItem("urbana-user")) || {};
    const fname = document.getElementById("pf-fname").value.trim();
    const lname = document.getElementById("pf-lname").value.trim();
    user.name = (fname + " " + lname).trim() || user.name;
    user.email = document.getElementById("pf-email").value.trim() || user.email;
    user.mobile = document.getElementById("pf-mobile").value.trim() || user.mobile;
    localStorage.setItem("urbana-user", JSON.stringify(user));
    const ok = document.getElementById("save-ok");
    ok.style.display = "block";
    setTimeout(() => ok.style.display = "none", 3000);
}

// ── ADDRESS MANAGEMENT ──
let editingAddrIdx = -1;

function getAddresses() {
    return JSON.parse(localStorage.getItem("urbana-addresses")) || [];
}
function saveAddresses(arr) {
    localStorage.setItem("urbana-addresses", JSON.stringify(arr));
}

const ADDR_TAG = { home: { label: "🏠 Home", cls: "tag-home" }, work: { label: "🏢 Work", cls: "tag-work" }, other: { label: "📦 Other", cls: "tag-work" } };

function renderAddresses() {
    const addresses = getAddresses();
    const grid = document.getElementById("addr-grid-wrap");
    if (!grid) return;

    let html = addresses.map((a, i) => {
        const tag = ADDR_TAG[a.type] || ADDR_TAG.home;
        return `<div class="addr-card ${i === 0 ? 'default-addr' : ''}">
            <span class="addr-tag ${tag.cls}">${tag.label}</span>
            <div class="addr-name">${a.name}</div>
            <div class="addr-text">${a.addr}, ${a.city} – ${a.pin}, ${a.state}</div>
            <div class="addr-phone">${a.phone}</div>
            <div class="addr-actions">
                <button class="addr-btn" onclick="editAddress(${i})">Edit</button>
                <button class="addr-btn del" onclick="removeAddress(${i})">Remove</button>
            </div>
        </div>`;
    }).join("");

    html += `<button class="addr-add" onclick="openAddrForm()">
        <i data-lucide="plus-circle"></i><span>Add New Address</span>
    </button>`;

    grid.innerHTML = html;
    if (window.lucide) lucide.createIcons();
}

function openAddrForm(idx = -1) {
    editingAddrIdx = idx;
    const form = document.getElementById("addr-form-wrap");
    const title = document.getElementById("addr-form-title");
    form.style.display = "block";

    if (idx >= 0) {
        const a = getAddresses()[idx];
        title.textContent = "Edit Address";
        document.getElementById("af-name").value  = a.name;
        document.getElementById("af-phone").value = a.phone;
        document.getElementById("af-addr").value  = a.addr;
        document.getElementById("af-city").value  = a.city;
        document.getElementById("af-pin").value   = a.pin;
        document.getElementById("af-state").value = a.state;
        document.getElementById("af-type").value  = a.type;
    } else {
        title.textContent = "Add New Address";
        ["af-name","af-phone","af-addr","af-city","af-pin"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("af-state").value = "";
        document.getElementById("af-type").value  = "home";
    }
    document.getElementById("addr-form-err").textContent = "";
    form.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeAddrForm() {
    document.getElementById("addr-form-wrap").style.display = "none";
    editingAddrIdx = -1;
}

function setAddrFieldError(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.borderColor = "#e74c3c";
    el.style.background  = "#fff8f8";
    document.getElementById("addr-form-err").textContent = msg;
}

function saveAddress() {
    const name  = document.getElementById("af-name").value.trim();
    const phone = document.getElementById("af-phone").value.trim();
    const addr  = document.getElementById("af-addr").value.trim();
    const city  = document.getElementById("af-city").value.trim();
    const pin   = document.getElementById("af-pin").value.trim();
    const state = document.getElementById("af-state").value;
    const type  = document.getElementById("af-type").value;

    // Reset borders
    ["af-name","af-phone","af-addr","af-city","af-pin","af-state"].forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.style.borderColor = ""; el.style.background = ""; }
    });
    document.getElementById("addr-form-err").textContent = "";

    if (!name)           { setAddrFieldError("af-name",  "Enter full name"); return; }
    if (phone.length !== 10) { setAddrFieldError("af-phone", "Enter a valid 10-digit phone number"); return; }
    if (!addr)           { setAddrFieldError("af-addr",  "Enter street address"); return; }
    if (!city)           { setAddrFieldError("af-city",  "Enter city"); return; }
    if (pin.length !== 6){ setAddrFieldError("af-pin",   "Enter a valid 6-digit PIN code"); return; }
    if (!state)          { setAddrFieldError("af-state", "Select a state"); return; }

    const addresses = getAddresses();
    const entry = { name, phone, addr, city, pin, state, type };

    if (editingAddrIdx >= 0) {
        addresses[editingAddrIdx] = entry;
    } else {
        addresses.push(entry);
    }

    saveAddresses(addresses);
    closeAddrForm();
    renderAddresses();
}

function editAddress(idx) {
    openAddrForm(idx);
}

function removeAddress(idx) {
    const addresses = getAddresses();
    addresses.splice(idx, 1);
    saveAddresses(addresses);
    renderAddresses();
}

function logoutUser() {
    localStorage.removeItem("urbana-user");
    window.location.href = "login.html";
}
</script>
</body>
</html>
