<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" id="cat-meta-desc" content="Browse our full fashion collection at Urbana. Filter by style, price and size.">
<link rel="stylesheet" href="urbana.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"></noscript>
<script src="https://unpkg.com/lucide@latest" defer></script>
<title>Shop - Urbana Fashion</title>

<style>
/* ═══════════════════════════════════════
   MOBILE PILL FILTERS — Amazon style
   3 rows, each horizontally scrollable
   ═══════════════════════════════════════ */

/* Hide the old sidebar on mobile */
@media (max-width: 768px) {
  .filters-sidebar { display: none !important; }
  .main-wrapper {
    display: block !important;
    padding: 0 !important;
  }

  /* Sticky filter bar container */
  .mobile-filters {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f7f7f7;
    padding: 8px 0 6px;
    border-bottom: 1px solid #e5e5e5;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* Each filter row */
  .filter-row {
    display: flex;
    align-items: center;
    overflow-x: auto;
    overflow-y: visible;
    white-space: nowrap;
    padding: 3px 12px 3px;
    gap: 7px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filter-row::-webkit-scrollbar { display: none; }

  /* Row label badge */
  .filter-row-label {
    flex-shrink: 0;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #888;
    text-transform: uppercase;
    min-width: 52px;
    padding-right: 4px;
    border-right: 1.5px solid #ddd;
    margin-right: 2px;
  }

  /* Individual pill */
  .filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1.5px solid #ddd;
    background: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #333;
    cursor: pointer;
    transition: all 0.18s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    line-height: 1;
  }

  .filter-pill:active {
    transform: scale(0.96);
  }

  /* Active / selected pill */
  .filter-pill.active {
    background: #111;
    border-color: #111;
    color: #fff;
  }

  /* Colour dot inside colour pills */
  .colour-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,0.15);
  }

  /* Active clear-all pill */
  .filter-pill.clear-pill {
    background: #fff3cd;
    border-color: #f4a000;
    color: #b45309;
  }

  /* Result count bar */
  .result-count-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px 4px;
    font-size: 11px;
    color: #888;
    font-weight: 600;
  }
  .result-count-bar span { color: #111; font-weight: 700; }

  /* Products grid on mobile */
  #product-container {
    padding: 10px 10px 80px;
  }
}

/* Desktop: keep old sidebar layout */
@media (min-width: 769px) {
  .mobile-filters { display: none !important; }
}
</style>
</head>

<body>

<div id="header"></div>

<!-- ══════════════════════════════════════
     MOBILE FILTER PILLS (3 scrollable rows)
     ══════════════════════════════════════ -->
<div class="mobile-filters" id="mobileFilters">

  <!-- ROW 1: COLOUR -->
  <div class="filter-row" id="colourRow">
    <span class="filter-row-label">COLOUR</span>
    <span class="filter-pill" data-type="colour" data-value="black" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#111"></span>Black
    </span>
    <span class="filter-pill" data-type="colour" data-value="blue" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#1565c0"></span>Blue
    </span>
    <span class="filter-pill" data-type="colour" data-value="white" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#fff;border-color:#ccc"></span>White
    </span>
    <span class="filter-pill" data-type="colour" data-value="grey" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#9e9e9e"></span>Grey
    </span>
    <span class="filter-pill" data-type="colour" data-value="pink" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#e91e8c"></span>Pink
    </span>
    <span class="filter-pill" data-type="colour" data-value="green" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#2e7d32"></span>Green
    </span>
    <span class="filter-pill" data-type="colour" data-value="purple" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#7b1fa2"></span>Purple
    </span>
    <span class="filter-pill" data-type="colour" data-value="dark blue" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#0d1b4b"></span>Dark Blue
    </span>
    <span class="filter-pill" data-type="colour" data-value="peach" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#ffcba4"></span>Peach
    </span>
    <span class="filter-pill" data-type="colour" data-value="red" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#c62828"></span>Red
    </span>
    <span class="filter-pill" data-type="colour" data-value="yellow" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#f9a825"></span>Yellow
    </span>
    <span class="filter-pill" data-type="colour" data-value="orange" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#e65100"></span>Orange
    </span>
    <span class="filter-pill" data-type="colour" data-value="brown" onclick="togglePill(this)">
      <span class="colour-dot" style="background:#5d4037"></span>Brown
    </span>
    <span class="filter-pill" data-type="colour" data-value="multi" onclick="togglePill(this)">
      <span class="colour-dot" style="background:linear-gradient(135deg,#e91e8c,#1565c0,#2e7d32)"></span>Multi
    </span>
  </div>

  <!-- ROW 2: PRICE -->
  <div class="filter-row" id="priceRow">
    <span class="filter-row-label">PRICE</span>
    <span class="filter-pill" data-type="price" data-value="low" onclick="togglePill(this)">Under ₹500</span>
    <span class="filter-pill" data-type="price" data-value="mid" onclick="togglePill(this)">₹500–₹1000</span>
    <span class="filter-pill" data-type="price" data-value="high" onclick="togglePill(this)">Above ₹1000</span>
  </div>

  <!-- ROW 3: DISCOUNT -->
  <div class="filter-row" id="discountRow">
    <span class="filter-row-label">DISCOUNT</span>
    <span class="filter-pill" data-type="discount" data-value="10" onclick="togglePill(this)">10%+</span>
    <span class="filter-pill" data-type="discount" data-value="30" onclick="togglePill(this)">30%+</span>
    <span class="filter-pill" data-type="discount" data-value="50" onclick="togglePill(this)">50%+</span>
  </div>

  <!-- Result count + clear all -->
  <div class="result-count-bar">
    <div id="resultCountBar">Loading...</div>
    <span id="clearAllFilters" onclick="clearAllPills()"
      style="font-size:11px;font-weight:700;color:#e74c3c;cursor:pointer;display:none;">
      ✕ Clear All
    </span>
  </div>

</div>

<!-- ══════════════════════════════════════
     DESKTOP LAYOUT (sidebar + grid)
     ══════════════════════════════════════ -->
<div class="main-wrapper">

  <div class="filters-sidebar">
    <h3>FILTERS</h3>

    <h4>COLOUR</h4>
    <label><input type="checkbox" class="colour" value="black"> Black</label>
    <label><input type="checkbox" class="colour" value="blue"> Blue</label>
    <label><input type="checkbox" class="colour" value="white"> White</label>
    <label><input type="checkbox" class="colour" value="grey"> Grey</label>
    <label><input type="checkbox" class="colour" value="pink"> Pink</label>
    <label><input type="checkbox" class="colour" value="green"> Green</label>
    <label><input type="checkbox" class="colour" value="purple"> Purple</label>
    <label><input type="checkbox" class="colour" value="dark blue"> Dark Blue</label>
    <label><input type="checkbox" class="colour" value="peach"> Peach</label>

    <h4>PRICE</h4>
    <label><input type="checkbox" class="price" value="low"> Under ₹500</label>
    <label><input type="checkbox" class="price" value="mid"> ₹500–₹1000</label>
    <label><input type="checkbox" class="price" value="high"> Above ₹1000</label>

    <h4>DISCOUNT</h4>
    <label><input type="checkbox" class="discount" value="10"> 10%+</label>
    <label><input type="checkbox" class="discount" value="30"> 30%+</label>
    <label><input type="checkbox" class="discount" value="50"> 50%+</label>
  </div>

  <div class="products" id="product-container"></div>

</div>

<div id="footer"></div>

<script src="common.js"></script>
<script src="category.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){
  loadLayout();
  const params = new URLSearchParams(window.location.search);
  const section = params.get("section");
  loadProducts(section);
});

/* ── PILL TOGGLE ── */
function togglePill(pill) {
  const type = pill.dataset.type;
  const value = pill.dataset.value;
  const isActive = pill.classList.contains("active");

  if (type === "colour") {
    // multi-select for colours
    pill.classList.toggle("active");
  } else {
    // single-select for price and discount rows
    document.querySelectorAll(`.filter-pill[data-type="${type}"]`).forEach(p => {
      if (p !== pill) p.classList.remove("active");
    });
    pill.classList.toggle("active");
  }

  // Sync hidden desktop checkboxes so category.js renderProducts() still works
  syncDesktopCheckboxes();
  updateClearBtn();

  // Re-render
  const section = new URLSearchParams(window.location.search).get("section");
  renderProducts(section);
}

/* ── SYNC pills → desktop checkboxes ── */
function syncDesktopCheckboxes() {
  // colours
  document.querySelectorAll('.colour').forEach(cb => {
    const pill = document.querySelector(`.filter-pill[data-type="colour"][data-value="${cb.value}"]`);
    cb.checked = pill ? pill.classList.contains("active") : false;
  });
  // price
  document.querySelectorAll('.price').forEach(cb => {
    const pill = document.querySelector(`.filter-pill[data-type="price"][data-value="${cb.value}"]`);
    cb.checked = pill ? pill.classList.contains("active") : false;
  });
  // discount
  document.querySelectorAll('.discount').forEach(cb => {
    const pill = document.querySelector(`.filter-pill[data-type="discount"][data-value="${cb.value}"]`);
    cb.checked = pill ? pill.classList.contains("active") : false;
  });
}

/* ── CLEAR ALL ── */
function clearAllPills() {
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  syncDesktopCheckboxes();
  updateClearBtn();
  const section = new URLSearchParams(window.location.search).get("section");
  renderProducts(section);
}

/* ── Show/hide "Clear All" button ── */
function updateClearBtn() {
  const anyActive = document.querySelectorAll('.filter-pill.active').length > 0;
  const btn = document.getElementById('clearAllFilters');
  if (btn) btn.style.display = anyActive ? 'inline' : 'none';
}

/* ── Keep desktop sidebar checkboxes working on desktop ── */
document.addEventListener("change", function(e) {
  if (e.target.matches(".colour, .price, .discount")) {
    const section = new URLSearchParams(window.location.search).get("section");
    renderProducts(section);
  }
});
</script>

</body>
</html>
