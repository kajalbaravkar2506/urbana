<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Get in touch with the Urbana Fashion team for support, feedback, or queries.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Contact Us - Urbana Fashion</title>
<link rel="stylesheet" href="urbana.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"></noscript>
<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></noscript>
<script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
<div id="header"></div>
<div class="page-wrapper">
    <div class="page-title">Contact Us</div>
    <div class="page-subtitle">We'd love to hear from you</div>

    <div class="contact-grid">
        <div class="contact-card"><i data-lucide="mail"></i><div><h3>Email Us</h3><p><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="9feceaefeff0edebdfeaedfdfef1fef9feecf7f6f0f1b1fcf0f2">[email&#160;protected]</a>We reply within 24 hours</p></div></div>
        <div class="contact-card"><i data-lucide="phone"></i><div><h3>Call Us</h3><p>+91 98765 43210Mon–Sat, 9am–6pm</p></div></div>
        <div class="contact-card"><i data-lucide="map-pin"></i><div><h3>Visit Us</h3><p>123, Fashion StreetMumbai, Maharashtra 400001</p></div></div>
        <div class="contact-card"><i data-lucide="message-circle"></i><div><h3>Live Chat</h3><p>Chat with us on WhatsAppQuick responses guaranteed</p></div></div>
    </div>

    <div class="form-section">
        <h2>Send Us a Message</h2>
        <div class="form-row">
            <div class="form-group"><label>FIRST NAME</label><input type="text" placeholder="Your first name"></div>
            <div class="form-group"><label>LAST NAME</label><input type="text" placeholder="Your last name"></div>
        </div>
        <div class="form-group"><label>EMAIL</label><input type="email" placeholder="your@email.com"></div>
        <div class="form-group"><label>SUBJECT</label>
            <select>
                <option value="">Select a subject</option>
                <option>Order Issue</option>
                <option>Return / Exchange</option>
                <option>Product Query</option>
                <option>Payment Issue</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group"><label>MESSAGE</label><textarea placeholder="Tell us how we can help..."></textarea></div>
        <button class="submit-btn" onclick="alert('Message sent! We\'ll get back to you within 24 hours.')">SEND MESSAGE</button>
    </div>
</div>
<div id="footer"></div>
<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
<script src="common.js"></script>
<script>document.addEventListener("DOMContentLoaded", loadLayout);</script>
